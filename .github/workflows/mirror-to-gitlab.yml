name: Mirror to GitLab

on:
  push:
    branches: [main]
    tags: ["**"]
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

concurrency:
  group: mirror-to-gitlab
  cancel-in-progress: false

jobs:
  mirror-git:
    name: Mirror branches, tags, history and signatures
    if: ${{ github.event_name != 'release' }}
    runs-on: ubuntu-latest
    steps:
      - name: Bare-mirror clone the source repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --mirror "https://x-access-token:${GH_TOKEN}@github.com/eskopp/AstroBlogTheme.git" source.git

      - name: Push mirror to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          set -euo pipefail
          cd source.git
          GITLAB_REPO_URL="https://oauth2:${GITLAB_TOKEN}@gitlab.erik-skopp.de/Themes/AstroBlogTheme.git"

          git lfs fetch --all origin || true
          git lfs push --all "$GITLAB_REPO_URL" || true

          # concurrent workflow runs (push main + push tag) can race the mirror
          # push; retry after re-fetching the latest state from GitHub.
          for attempt in 1 2 3; do
            if git push --mirror "$GITLAB_REPO_URL"; then
              exit 0
            fi
            echo "mirror push failed (attempt $attempt), refetching and retrying..."
            sleep $((attempt * 10))
            git fetch --prune --tags origin
          done
          echo "mirror push still failing after retries" >&2
          exit 1

  mirror-releases:
    name: Mirror GitHub Releases to GitLab Releases
    if: ${{ github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Sync releases via API
        env:
          GH_TOKEN: ${{ github.token }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_PROJECT: Themes%2FAstroBlogTheme
        run: |
          set -euo pipefail

          releases=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/eskopp/AstroBlogTheme/releases?per_page=100")

          echo "$releases" | jq -c '.[]' | while read -r release; do
            tag=$(echo "$release" | jq -r '.tag_name')
            name=$(echo "$release" | jq -r '.name // .tag_name')
            body=$(echo "$release" | jq -r '.body // ""')

            exists=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "PRIVATE-TOKEN: $GITLAB_TOKEN" \
              "https://gitlab.erik-skopp.de/api/v4/projects/$GITLAB_PROJECT/releases/$tag")

            payload=$(jq -n --arg tag "$tag" --arg name "$name" --arg desc "$body" \
              '{tag_name: $tag, name: $name, description: $desc}')

            if [ "$exists" = "200" ]; then
              curl -s -X PUT -H "PRIVATE-TOKEN: $GITLAB_TOKEN" -H "Content-Type: application/json" \
                -d "$payload" \
                "https://gitlab.erik-skopp.de/api/v4/projects/$GITLAB_PROJECT/releases/$tag" > /dev/null
            else
              curl -s -X POST -H "PRIVATE-TOKEN: $GITLAB_TOKEN" -H "Content-Type: application/json" \
                -d "$payload" \
                "https://gitlab.erik-skopp.de/api/v4/projects/$GITLAB_PROJECT/releases" > /dev/null
            fi

            echo "$release" | jq -c '.assets[]?' | while read -r asset; do
              asset_name=$(echo "$asset" | jq -r '.name')
              asset_url=$(echo "$asset" | jq -r '.browser_download_url')
              link_payload=$(jq -n --arg name "$asset_name" --arg url "$asset_url" \
                '{name: $name, url: $url}')
              curl -s -X POST -H "PRIVATE-TOKEN: $GITLAB_TOKEN" -H "Content-Type: application/json" \
                -d "$link_payload" \
                "https://gitlab.erik-skopp.de/api/v4/projects/$GITLAB_PROJECT/releases/$tag/assets/links" > /dev/null || true
            done
          done
